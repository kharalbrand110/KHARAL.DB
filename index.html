<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHARAL MODS · SIM Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #25D366;
            margin: 20px 0;
        }
        .card {
            background: #16213e;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: #0f3460;
            color: white;
            text-align: center;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: #25D366;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }
        .result-box {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
        .error-msg {
            background: #ff4757;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 10px 0;
        }
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25D366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">🔍 KHARAL MODS</div>
    
    <div class="card">
        <input type="text" id="phoneInput" placeholder="Enter Mobile Number e.g. 03001234567">
        <button onclick="searchNumber()">
            <i class="fas fa-search"></i> SEARCH DATABASE
        </button>
        <p style="font-size: 12px; margin-top: 10px; text-align: center;">⚠️ For verification only</p>
    </div>

    <div id="resultsArea"></div>

    <div class="card">
        <h3 style="text-align: center;">📌 Paid Services</h3>
        <ul style="list-style: none; padding-left: 0;">
            <li>✅ CNIC Full Details</li>
            <li>✅ SIM Ownership</li>
            <li>✅ Call Details (CDR)</li>
            <li>✅ Live Location</li>
            <li>✅ IMEI Tracking</li>
        </ul>
    </div>

    <footer>
        <p>© 2025 Kharal Mods · Educational Purpose</p>
    </footer>
</div>

<a href="https://wa.me/923178399498" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    async function searchNumber() {
        const phone = document.getElementById('phoneInput').value.trim();
        const resultsDiv = document.getElementById('resultsArea');
        
        // Validation
        if (!phone) {
            resultsDiv.innerHTML = `<div class="error-msg">❌ Please enter a mobile number</div>`;
            return;
        }
        
        if (!/^03\d{9}$/.test(phone)) {
            resultsDiv.innerHTML = `<div class="error-msg">❌ Invalid format. Use: 03001234567</div>`;
            return;
        }
        
        // Show loading
        resultsDiv.innerHTML = `<div class="result-box">⏳ Searching database...</div>`;
        
        // ========================================
        // OPTION 1: TRY REAL API (if available)
        // ========================================
        const apiUrl = `https://pakdatabase.site/api/search.php?username=Kami&password=123456&search_term=${phone}`;
        
        try {
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                throw new Error('API server down');
            }
            
            const data = await response.json();
            
            // Check if data exists
            if (data && Object.keys(data).length > 0) {
                displayResults(data);
            } else {
                showNoDataMessage(phone);
            }
            
        } catch (error) {
            console.error('API Error:', error);
            // API down - show fallback message
            showNoDataMessage(phone);
        }
    }
    
    function displayResults(data) {
        const resultsDiv = document.getElementById('resultsArea');
        let html = '';
        
        for (const network in data) {
            const records = data[network];
            if (Array.isArray(records) && records.length > 0) {
                records.forEach(record => {
                    html += `
                        <div class="result-box">
                            <strong>📱 Mobile:</strong> ${record.Mobile || record.SUB_NO || 'N/A'}<br>
                            <strong>👤 Name:</strong> ${record.Name || record.NAME || 'N/A'}<br>
                            <strong>🆔 CNIC:</strong> ${record.CNIC || record.NIC || 'N/A'}<br>
                            <strong>📍 Address:</strong> ${record.Address || record.ADDRESS || 'N/A'}
                        </div>
                    `;
                });
            }
        }
        
        if (html) {
            resultsDiv.innerHTML = html;
        } else {
            resultsDiv.innerHTML = `<div class="error-msg">⚠️ No records found in database</div>`;
        }
    }
    
    function showNoDataMessage(phone) {
        const resultsDiv = document.getElementById('resultsArea');
        resultsDiv.innerHTML = `
            <div class="error-msg">
                ⚠️ No free data found for ${phone}<br><br>
                <strong>💎 Premium data available for ₹500</strong><br><br>
                <a href="https://wa.me/923292359951" target="_blank" style="color: #25D366; font-weight: bold;">
                    📲 Contact Admin on WhatsApp
                </a>
            </div>
        `;
    }
</script>
</body>
</html>
